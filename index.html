<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASHTON RENÉE Jewelry | Coming Soon</title>

  <meta
    name="description"
    content="ASHTON RENÉE creates handmade jewelry with meaning, inspired by the women who leave their mark on our lives."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, #fffdf9 0%, #faf5ec 45%, #f3eadc 100%);
      color: #9a6b20;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .page {
      width: 100%;
      max-width: 850px;
    }

    .brand {
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      font-weight: 400;
      letter-spacing: 0.16em;
      line-height: 1.15;
      margin-left: 0.16em;
      color: #a87924;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 520px;
      margin: 26px auto 18px;
    }

    .line {
      height: 1px;
      flex: 1;
      background: #b78a3a;
    }

    .diamond {
      width: 13px;
      height: 13px;
      border: 1px solid #b78a3a;
      transform: rotate(45deg);
      margin: 0 14px;
    }

    .jewelry {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.7em;
      margin-left: 0.7em;
      color: #a87924;
    }

    .coming-soon {
      margin-top: 70px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      margin-left: 0.35em;
      text-transform: uppercase;
      color: #a87924;
    }

    h1 {
      margin-top: 20px;
      font-size: clamp(1.5rem, 4vw, 2.35rem);
      font-weight: 400;
      color: #57483b;
    }

    .description {
      max-width: 610px;
      margin: 22px auto 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.8;
      color: #786b60;
    }

    .footer {
      margin-top: 75px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: #9b8f84;
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 20px;
      }

      .brand {
        letter-spacing: 0.10em;
        margin-left: 0.10em;
      }

      .divider {
        max-width: 300px;
        margin-top: 20px;
      }

      .jewelry {
        font-size: 0.7rem;
        letter-spacing: 0.5em;
        margin-left: 0.5em;
      }

      .coming-soon {
        margin-top: 55px;
      }

      .description {
        font-size: 0.95rem;
      }

      .footer {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="brand">ASHTON RENÉE</div>

    <div class="divider">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line"></div>
    </div>

    <div class="jewelry">JEWELRY</div>

    <div class="coming-soon">Coming Soon</div>

    <h1>Something meaningful is coming.</h1>

    <p class="description">
      Handmade jewelry with meaning, inspired by the women who leave their mark on our lives.
    </p>

    <div class="footer">
      ASHTONRENÉEJEWELRY.COM
    </div>

  </main>
</body>
</html>
